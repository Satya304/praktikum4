<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Transaksi</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="container mt-5">

        <h2 class="mb-4">Data Transaksi</h2>

        <button class="btn btn-primary mb-3" id="addDataBtn">
            Tambah Transaksi
        </button>

        <div id="formContainer" style="display: none;">
            <div class="card mb-4">
                <div class="card-body">

                    <h3 id="formTitle">Tambah Transaksi Baru</h3>

                    <form id="transactionForm">

                        <div class="mb-3">
                            <label for="tanggalTransaksi" class="form-label">
                                Tanggal Transaksi
                            </label>
                            <input type="date"
                                   class="form-control"
                                   id="tanggalTransaksi"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="idProduk" class="form-label">
                                ID Produk
                            </label>
                            <input type="number"
                                   class="form-control"
                                   id="idProduk"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="jumlah" class="form-label">
                                Jumlah
                            </label>
                            <input type="number"
                                   class="form-control"
                                   id="jumlah"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="totalHarga" class="form-label">
                                Total Harga
                            </label>
                            <input type="number"
                                   class="form-control"
                                   id="totalHarga"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label for="statusTransaksi" class="form-label">
                                Status Transaksi
                            </label>

                            <select class="form-control"
                                    id="statusTransaksi"
                                    required>

                                <option value="Pending">Pending</option>
                                <option value="Proses">Proses</option>
                                <option value="Selesai">Selesai</option>

                            </select>
                        </div>

                        <button type="submit"
                                class="btn btn-success"
                                id="submitBtn">
                            Submit
                        </button>

                        <button type="button"
                                class="btn btn-secondary"
                                id="cancelBtn">
                            Batal
                        </button>

                    </form>

                </div>
            </div>
        </div>

        <div class="table-responsive">

            <table class="table table-bordered table-striped">

                <thead class="table-dark">
                    <tr>
                        <th>ID Transaksi</th>
                        <th>Tanggal Transaksi</th>
                        <th>ID Produk</th>
                        <th>Jumlah</th>
                        <th>Total Harga</th>
                        <th>Status Transaksi</th>
                        <th>Aksi</th>
                    </tr>
                </thead>

                <tbody id="transactionTableBody">
                </tbody>

            </table>

        </div>

    </div>


    <script>

        // URL API
        const url = 'http://api.melangkah.my.id/transaksi/read.php';
        const createUrl = 'http://api.melangkah.my.id/transaksi/create.php';
        const updateUrl = 'http://api.melangkah.my.id/transaksi/update.php';


        // Menyimpan data transaksi dari API
        let transactions = [];


        // Ambil data transaksi
        async function getTransactions() {

            try {

                let response = await fetch(url);

                if (!response.ok)
                    throw new Error(`HTTP error! status: ${response.status}`);

                transactions = await response.json();

                let tableBody =
                    document.getElementById('transactionTableBody');

                tableBody.innerHTML = '';


                transactions.forEach((transaction, index) => {

                    let row = `
                        <tr>

                            <td>${transaction.id_transaksi}</td>

                            <td>${transaction.tanggal_transaksi}</td>

                            <td>${transaction.id_produk}</td>

                            <td>${transaction.jumlah}</td>

                            <td>${transaction.total_harga}</td>

                            <td>${transaction.status_transaksi}</td>

                            <td>

                                <button
                                    class="btn btn-warning btn-sm"
                                    onclick="editTransaction(${index})">
                                    Edit
                                </button>

                            </td>

                        </tr>
                    `;

                    tableBody.innerHTML += row;

                });

            } catch (error) {

                console.error(
                    "Gagal mengambil data transaksi:",
                    error
                );

                alert(
                    "Gagal mengambil data transaksi."
                );

            }

        }

        document.getElementById('addDataBtn')
            .addEventListener('click', function () {

                document.getElementById('formTitle')
                    .textContent = "Tambah Transaksi Baru";

                document.getElementById('submitBtn')
                    .textContent = "Submit";

                document.getElementById('transactionForm')
                    .reset();

                document.getElementById('transactionForm')
                    .dataset.id = '';

                document.getElementById('formContainer')
                    .style.display = 'block';

            });

        document.getElementById('cancelBtn')
            .addEventListener('click', function () {

                document.getElementById('formContainer')
                    .style.display = 'none';

            });

        document.getElementById('transactionForm')
            .addEventListener('submit', async function (e) {

                e.preventDefault();

                const id = this.dataset.id;

                const tanggalTransaksi =
                    document.getElementById('tanggalTransaksi').value;

                const idProduk =
                    document.getElementById('idProduk').value;

                const jumlah =
                    document.getElementById('jumlah').value;

                const totalHarga =
                    document.getElementById('totalHarga').value;

                const statusTransaksi =
                    document.getElementById('statusTransaksi').value;

                const transactionData = {

                    tanggal_transaksi: tanggalTransaksi,

                    id_produk: idProduk,

                    jumlah: jumlah,

                    total_harga: totalHarga,

                    status_transaksi: statusTransaksi

                };


                try {

                    if (id) {

                        transactionData.id_transaksi = id;


                        let response = await fetch(updateUrl, {

                            method: 'PUT',

                            headers: {
                                'Content-Type': 'application/json'
                            },

                            body: JSON.stringify(transactionData)

                        });


                        if (!response.ok)
                            throw new Error(
                                `HTTP error! status: ${response.status}`
                            );


                        alert(
                            'Transaksi berhasil diperbarui!'
                        );


                    } else {

                        let response = await fetch(createUrl, {

                            method: 'POST',

                            headers: {
                                'Content-Type': 'application/json'
                            },

                            body: JSON.stringify(transactionData)

                        });


                        if (!response.ok)
                            throw new Error(
                                `HTTP error! status: ${response.status}`
                            );


                        alert(
                            'Transaksi berhasil ditambahkan!'
                        );

                    }

                    getTransactions();

                    document.getElementById('formContainer')
                        .style.display = 'none';


                } catch (error) {

                    console.error(
                        "Gagal mengirim data transaksi:",
                        error
                    );

                    alert(
                        "Gagal mengirim data transaksi."
                    );

                }

            });

        function editTransaction(index) {

            try {

                let transaction = transactions[index];


                if (!transaction) {

                    throw new Error(
                        'Data transaksi tidak ditemukan'
                    );

                }

                document.getElementById('tanggalTransaksi')
                    .value = transaction.tanggal_transaksi;

                document.getElementById('idProduk')
                    .value = transaction.id_produk;

                document.getElementById('jumlah')
                    .value = transaction.jumlah;

                document.getElementById('totalHarga')
                    .value = transaction.total_harga;

                document.getElementById('statusTransaksi')
                    .value = transaction.status_transaksi;

                document.getElementById('formTitle')
                    .textContent = 'Update Data Transaksi';

                document.getElementById('submitBtn')
                    .textContent = 'Update';

                document.getElementById('transactionForm')
                    .dataset.id = transaction.id_transaksi;

                document.getElementById('formContainer')
                    .style.display = 'block';


            } catch (error) {

                console.error(
                    'Gagal mengambil data transaksi:',
                    error
                );

                alert(
                    'Terjadi kesalahan saat mengambil data transaksi.'
                );

            }

        }

        getTransactions();

    </script>

</body>

</html>
